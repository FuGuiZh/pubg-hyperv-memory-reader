syntax = "proto3";

package pubg.radar.v1;

// UDP 127.0.0.1:13101. Each datagram contains exactly one RadarFrame,
// without a length prefix, JSON wrapper, compression, or gRPC framing.
// See README.md for reassembly, freshness, and coordinate semantics.
message RadarFrame {
  uint32 schema_version = 1;                // Always 1 for this schema.
  string stream_id = 2;                     // Unique reader run/log directory ID.
  uint64 sequence = 3;                      // Monotonic export sequence in this stream.
  uint64 sent_at_unix_ms = 4;
  uint64 capture_started_monotonic_ms = 5;   // Source monotonic clock, not Unix time.
  uint32 capture_duration_ms = 6;
  FrameStatus status = 7;
  uint32 process_id = 8;
  uint64 process_sequence = 9;              // OS process instance identity.
  uint64 binding_generation = 10;
  uint64 world_id = 11;                     // Opaque identity, not a map identifier.
  uint64 game_state_id = 12;
  uint64 level_id = 13;
  optional float world_time_seconds = 14;
  double meters_per_unit = 15;              // Currently 0.01; coordinates are not scaled.
  LocalPlayer local_player = 16;            // Presence is meaningful.
  repeated Actor actors = 17;               // This part's entries. No team/distance/death filter.
  uint32 part_index = 18;                   // Zero based.
  uint32 part_count = 19;                   // >= 1. Normally 1; join all parts before publishing.
  uint32 actor_count = 20;                  // Total entries across every part, including unpositioned.
  Diagnostics diagnostics = 21;
  uint64 capture_sequence = 22;             // Same frame number as reader logs; 0 for connection status.
  uint32 nominal_interval_ms = 23;          // Normally 300; not a hard real-time guarantee.
  string source_build_sha256 = 24;
  MapContext map_context = 25;              // Accepted/rejected capture frames; independently checked metadata.
}

enum FrameStatus {
  FRAME_STATUS_UNSPECIFIED = 0;
  FRAME_ACCEPTED = 1;                       // Accepted by reader; not proof of complete world coverage.
  FRAME_REJECTED = 2;                       // Empty actors; map_context can independently succeed.
  FRAME_DISCONNECTED = 3;                   // Binding unavailable; empty actors.
  FRAME_STOPPED = 4;                        // Best effort final packet; empty actors.
}

message Vec3 {
  float x = 1;
  float y = 2;
  float z = 3;
}

message LocalPlayer {
  uint64 actor_id = 1;
  Vec3 position = 2;                        // May be absent even if actor_id is known.
  WorldOrigin position_origin = 3;          // Origin checked around this position's sampling interval.
}

message Actor {
  reserved 6, 9;                            // No sender-side self/enemy/type classification.
  uint64 actor_id = 1;                      // Opaque pointer identity; 0 if no confirmed association.
  uint64 player_state_id = 2;               // May be known even when actor_id/position are absent.
  optional sint32 roster_index = 3;
  Vec3 position = 4;                        // Absent != (0,0,0). Never guess missing coordinates.
  optional sint32 team_id = 5;              // Absent != team 0.
  string name = 7;                          // UTF-8, empty if unavailable.
  string type_name = 8;                     // Class/type name when verified by the reader.
  optional uint32 status_raw = 10;          // Uninterpreted source byte, not an alive/dead enum.
  optional uint32 dbno_raw = 11;
  optional uint32 killed_raw = 12;
  string availability = 13;
  string source = 14;
  uint64 observed_at_monotonic_ms = 15;      // Allows amortized scene observations to be aged independently.
  uint64 raw_actor_value = 16;
  uint64 class_id = 17;
  optional uint32 name_id = 18;
  optional uint32 item_id = 19;
  optional sint32 item_count = 20;
  string vehicle_type = 21;
  string item_name = 22;
  uint64 root_component_id = 23;
  optional uint32 object_id_raw = 24;       // Raw uint32 at Actor+0x24; not a decoded FName index.
  uint64 root_component_raw = 25;
  optional sint32 actor_array_index = 26;
  WorldOrigin position_origin = 27;         // Never substitute a newer frame's origin for a cached row.
}

// Raw signed integer World origin, in the same units as position (currently cm).
// Absolute world coordinates = position + this origin, component by component.
// Absence means the conversion is unverified; (0,0,0) is a valid observed origin.
// This is not a map-image pixel offset. Image extent/orientation belong to radar.
message WorldOrigin {
  sint32 x = 1;
  sint32 y = 2;
  sint32 z = 3;
}

message ObjectName {
  optional uint32 raw_index = 1;
  optional uint32 raw_number = 2;
  optional uint32 comparison_index = 3;     // Session-local FName index, never a stable map ID.
  optional uint32 number = 4;
  string base_name = 5;                    // Present as text only when verified.
  string full_name = 6;                    // base_name, plus _{number-1} when number > 0.
  bool wide = 7;
  bool verified = 8;                       // Chain/text/code rechecked; not a known-map classification.
}

message MapContext {
  ObjectName world_name = 1;               // Actual World object name, map association needs live validation.
  WorldOrigin player_sample_origin = 2;    // Core player capture only; scene rows carry their own origin.
  uint64 name_observed_at_monotonic_ms = 3;
  uint64 world_id = 4;                     // Identity for THIS name, not necessarily RadarFrame.world_id.
  bool world_root_unverified = 5;          // Accepted core may reuse its cached root. Independent reads recheck fresh root.
  NameCaptureStatus name_status = 6;       // Never infer success from an empty error field.
  uint32 root_read_attempts = 7;           // Independent name-root backend attempts; excludes core root reads.
  uint32 root_failed_attempts = 8;
}

enum NameCaptureStatus {
  NAME_CAPTURE_UNSPECIFIED = 0;            // Older senders did not provide an explicit status.
  NAME_NOT_ATTEMPTED = 1;
  NAME_SUCCEEDED = 2;
  NAME_FAILED = 3;
}

message Diagnostics {
  bool world_cache_used = 1;
  bool world_root_unverified = 2;
  bool world_cache_invalidated = 3;
  bool world_refresh_attempted = 4;
  bool world_refresh_verified = 5;
  uint32 root_read_attempts = 6;
  uint32 root_failed_attempts = 7;
  string error_code = 8;
  string error_stage = 9;
  uint32 player_roster_count = 10;
  uint32 matched_player_count = 11;
  uint32 positioned_player_count = 12;
  uint32 unmatched_player_count = 13;
  uint64 discovery_cycle = 14;
  uint32 discovery_cursor = 15;
  uint32 discovery_total = 16;
  bool discovery_running = 17;
  bool discovery_completed = 18;
  sint64 discovery_last_completed_age_ms = 19; // -1 means unknown.
  string discovery_error_stage = 20;
  uint32 player_slots_unusable = 21;
  bool scene_list_valid = 22;
  uint32 scene_actor_count = 23;
  uint32 scene_updated_count = 24;
  uint32 scene_next_cursor = 25;
  string scene_error_code = 26;
  string scene_error_stage = 27;
  string world_name_error_code = 28;
  string world_name_error_stage = 29;
  string player_origin_error_code = 30;
  string player_origin_error_stage = 31;
  string scene_origin_error_code = 32;
  string scene_origin_error_stage = 33;
}
